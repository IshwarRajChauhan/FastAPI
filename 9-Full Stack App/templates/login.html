{% extends "layout.html" %}
{% block content %}
<div class="container">
    <div class="card">
        <div class="card-header">
            Login
        </div>
        <div class="card-body">
            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" class="form-control" name="username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
        </div>
        <div class="card-footer text-muted">
            <a href="{{ url_for('render_register_page') }}">Register?</a>
        </div>
    </div>
</div>
<script>
    const loginForm = document.getElementById('loginForm');

    loginForm.addEventListener('submit', async function (event) {
        event.preventDefault();

        const formData = new FormData(loginForm);

        const response = await fetch('/auth/token', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: new URLSearchParams(formData)
        });

        if (response.ok) {
            const data = await response.json();

            document.cookie =
                `access_token=${data.access_token}; path=/; max-age=1200; samesite=lax`;

            window.location.href = '/todos/todo-page';
        } else {
            alert('Invalid username or password!');
        }
    });
</script>
{% endblock %}
